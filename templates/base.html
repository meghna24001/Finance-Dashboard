<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">

  <!-- Immediate theme application before paint -->
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

  <!-- PWA & Favicon -->
  <link rel="manifest" href="{{ url_for('pwa.manifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon-32.png', v='20260925-6') }}" sizes="32x32" type="image/png">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png', v='20260925-6') }}" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png', v='20260925-6') }}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ app_short_name }}">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='20260928-1') }}">
</head>
<body class="{% block body_class %}{% endblock %}"{% block body_attrs %}{% endblock %}>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='js/pwa.js') }}"></script>
</body>
</html>
